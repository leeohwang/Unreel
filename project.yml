# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Unreel
options:
  bundleIdPrefix: com.leeohwang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.0.0
targets:
  Unreel:
    type: application
    platform: iOS
    sources:
      - path: Unreel
    dependencies:
      - package: TelemetryDeck
    info:
      path: Unreel/Info.plist
      properties:
        CFBundleDisplayName: Unreel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeohwang.unreel
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your Apple team ID here, or pick your team in Xcode > Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
